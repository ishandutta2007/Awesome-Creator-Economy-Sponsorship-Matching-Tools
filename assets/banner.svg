<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="accentGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accentGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow1{0%{transform:scale(1) translate(0,0);opacity:.28}50%{transform:scale(1.18) translate(30px,-20px);opacity:.45}}@keyframes pulseGlow2{0%{transform:scale(1) translate(0,0);opacity:.22}50%{transform:scale(1.15) translate(-40px,25px);opacity:.38}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-18px) scale(1.2);opacity:.9}}@keyframes pulsePill{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.blob-1{transform-origin:200px 100px;animation:pulseGlow1 8s ease-in-out infinite}.blob-2{transform-origin:1000px 250px;animation:pulseGlow2 10s ease-in-out infinite}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 5.5s ease-in-out infinite 1s}.particle-3{animation:floatParticle 4.8s ease-in-out infinite 2s}.flow-line{stroke-dasharray:6 6;animation:dashFlow 2.5s linear infinite}.badge-pill-1{animation:pulsePill 4s ease-in-out infinite}.badge-pill-2{animatio