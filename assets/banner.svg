<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow1 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.28; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.45; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.22; }
      50% { transform: scale(1.15) translate(-40px, 25px); opacity: 0.38; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
      50% { transform: translateY(-18px) scale(1.2); opacity: 0.9; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulsePill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .blob-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow1 8s ease-in-out infinite;
    }
    .blob-2 {
      transform-origin: 1000px 250px;
      animation: pulseGlow2 10s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 5.5s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 4.8s ease-in-out infinite 2s; }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashFlow 2.5s linear infinite;
    }
    .badge-pill-1 { animation: pulsePill 4s ease-in-out infinite; }
    .badge-pill-2 { animation: pulsePill 4.5s ease-in-out infinite 0.8s; }
    .badge-pill-3 { animation: pulsePill 5s ease-in-out infinite 1.6s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Dynamic Blobs in Background (Non-Obstructing) -->
  <g opacity="0.4" style="mix-blend-mode: screen;">
    <circle class="blob-1" cx="220" cy="110" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="blob-2" cx="980" cy="240" r="150" fill="#a855f7" filter="url(#glow)" />
    <circle class="blob-1" cx="600" cy="290" r="100" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Subtle Tech Grid Lines in Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Flowing Network Curve Connecting Brands & Creators -->
  <g opacity="0.35" fill="none">
    <path class="flow-line" d="M 100 280 C 350 210, 450 330, 700 240 C 950 150, 1020 280, 1150 200" stroke="url(#accentGrad1)" stroke-width="2" />
  </g>

  <!-- Interactive/Dynamic Floating Light Nodes (Particles) -->
  <circle class="particle-1" cx="180" cy="80" r="4" fill="#38bdf8" />
  <circle class="particle-2" cx="1040" cy="90" r="5" fill="#ec4899" />
  <circle class="particle-3" cx="920" cy="300" r="4.5" fill="#a855f7" />
  <circle class="particle-2" cx="140" cy="260" r="3.5" fill="#6366f1" />

  <!-- Foreground Dynamic Feature Pills -->
  <g class="badge-pill-1" transform="translate(180, 40)">
    <rect width="190" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="95" y="19" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">🎯 Brand-Creator Matching</text>
  </g>
  <g class="badge-pill-2" transform="translate(500, 36)">
    <rect width="200" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text x="100" y="19" fill="#d8b4fe" font-size="12" font-weight="600" text-anchor="middle">📊 Audience Intelligence</text>
  </g>
  <g class="badge-pill-3" transform="translate(830, 42)">
    <rect width="190" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <text x="95" y="19" fill="#f472b6" font-size="12" font-weight="600" text-anchor="middle">⚡ Verified Sponsorships</text>
  </g>

  <!-- Main Foreground Content: Title & Subtitle (High Contrast, Bold, Clear) -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="600" y="152" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="-0.5">
      Awesome Creator Economy
    </text>
    <text x="600" y="198" fill="url(#accentGrad1)" font-size="34" font-weight="800" letter-spacing="-0.5">
      Sponsorship Matching Tools
    </text>

    <!-- Subtitle -->
    <text x="600" y="244" fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated Landscape of SaaS Platforms &amp; Open-Source Repositories for Creator Partnerships
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(600, 290)">
      <text x="-240" y="0" fill="#64748b" font-size="13" font-weight="600">✨ Pricing &amp; Tier Audits</text>
      <circle cx="-135" cy="-4" r="2.5" fill="#475569" />
      <text x="-50" y="0" fill="#64748b" font-size="13" font-weight="600">⭐ Star-Ranked Open Source</text>
      <circle cx="75" cy="-4" r="2.5" fill="#475569" />
      <text x="175" y="0" fill="#64748b" font-size="13" font-weight="600">📈 Sector &amp; Market Dynamics</text>
    </g>
  </g>
</svg>
